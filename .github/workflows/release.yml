name: Release

# Tag vX.Y.Z (annoté : son message devient les notes) → installeur testé + latest.json
# dans une Release GitHub en brouillon. La publication reste manuelle, après essai.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le tag annoté
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Front
        working-directory: frontend
        run: npm ci && npm test && npm run build

      - name: Backend
        run: pip install -e "backend[dev,build]"

      - name: Version du tag = vto.__version__
        run: |
          VERSION=$(python -c "import vto; print(vto.__version__)")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à vto.__version__ ($VERSION)"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Tests
        working-directory: backend
        run: ruff check . ../packaging && pytest

      - name: Exécutable (PyInstaller)
        run: pyinstaller packaging/vto.spec --noconfirm

      - name: Test de fumée de l'exécutable
        run: |
          ./dist/Kaloe/Kaloe.exe --self-check --output selfcheck.txt || { cat selfcheck.txt; exit 1; }
          cat selfcheck.txt

      - name: Inno Setup
        shell: pwsh
        run: |
          # Version récente exigée (x64compatible : Inno Setup ≥ 6.3), même si l'image en a une.
          choco upgrade innosetup -y --no-progress
          ./packaging/fetch_redist.ps1

      - name: Installeur
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          choco list innosetup --exact --limit-output | sed 's/^/::notice::/' || true
          # Les journaux exigent une connexion ; les annotations ::error:: sont lisibles par l'API publique.
          if ! "$ISCC" "//DAppVersion=$VERSION" packaging/installer.iss > iscc.log 2>&1; then
            tail -15 iscc.log | sed 's/^/::error::/'; exit 1
          fi
          tail -3 iscc.log
          echo "INSTALLER=packaging/Output/Kaloe-Setup-$VERSION.exe" >> "$GITHUB_ENV"

      # À activer avec le certificat (sous-projet ultérieur) : signer
      # dist/Kaloe/Kaloe.exe avant l'installeur, puis l'installeur lui-même.
      - name: Signature
        if: false
        run: echo "signature non configurée"

      - name: Installer, vérifier, désinstaller
        run: |
          ROOT=$(cygpath -w "$RUNNER_TEMP")
          export VTO_DATA_DIR="$ROOT\\vto-data"
          mkdir -p "$RUNNER_TEMP/vto-data" && echo garder > "$RUNNER_TEMP/vto-data/temoin.txt"
          "./$INSTALLER" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART '//TASKS=' \
            "//DIR=$ROOT\\vto-install" "//LOG=$ROOT\\install.log"
          sleep 5
          taskkill //IM Kaloe.exe //F || true  # relancée par l'installeur silencieux
          "$RUNNER_TEMP/vto-install/Kaloe.exe" --self-check --output installed.txt \
            || { cat installed.txt; exit 1; }
          sleep 2
          "$RUNNER_TEMP/vto-install/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          sleep 5
          test "$(cat "$RUNNER_TEMP/vto-data/temoin.txt")" = garder
          test ! -e "$RUNNER_TEMP/vto-install/Kaloe.exe"

      # Chemin réel des clients : la dernière version publiée est installée à son emplacement par
      # défaut, puis la nouvelle par-dessus ; l'app relancée déplace l'ancien dossier de données.
      - name: Mise à jour depuis la dernière version publiée
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.exe' --dir previous; then
            echo "::notice::Aucune Release publiée : essai de mise à jour ignoré"; exit 0
          fi
          PREVIOUS=$(ls previous/*.exe)
          echo "::notice::Mise à jour depuis $PREVIOUS"
          LOCAL=$(cygpath -u "$LOCALAPPDATA")
          MENU="$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs"
          "./$PREVIOUS" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART '//TASKS='
          sleep 8
          taskkill //IM VirtualTryOn.exe //F || true
          taskkill //IM Kaloe.exe //F || true
          # Données d'un client d'avant Kaloé (le dossier peut déjà exister si l'ancienne app est Kaloé).
          rm -rf "$LOCAL/Kaloe"
          mkdir -p "$LOCAL/VirtualTryOn/articles/temoin"
          echo '{}' > "$LOCAL/VirtualTryOn/articles/temoin/article.json"
          "./$INSTALLER" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART '//TASKS=' \
            "//LOG=$(cygpath -w "$RUNNER_TEMP")\update.log"
          sleep 10  # l'installeur relance l'app, qui migre les données au démarrage
          taskkill //IM Kaloe.exe //F || true
          sleep 2
          test -e "$LOCAL/Programs/Kaloe/Kaloe.exe"
          test ! -e "$LOCAL/Programs/VirtualTryOn" || { echo "::error::Ancien dossier d'installation présent"; exit 1; }
          test ! -e "$MENU/Virtual Try-On.lnk"
          test -e "$MENU"/Kalo*.lnk
          test -e "$LOCAL/Kaloe/articles/temoin/article.json" || { echo "::error::Données non migrées"; tail -20 "$LOCAL/VirtualTryOn/logs/vto.log" 2>/dev/null | sed 's/^/::error::/'; exit 1; }
          test ! -e "$LOCAL/VirtualTryOn"
          "$LOCAL/Programs/Kaloe/Kaloe.exe" --self-check --output updated.txt || { cat updated.txt; exit 1; }
          "$LOCAL/Programs/Kaloe/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          sleep 5
          test -e "$LOCAL/Kaloe/articles/temoin/article.json"
          test ! -e "$LOCAL/Programs/Kaloe/Kaloe.exe"

      - name: Manifeste
        run: |
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.txt
          else
            : > notes.txt
          fi
          python packaging/make_manifest.py --installer "$INSTALLER" --version "$VERSION" \
            --notes-file notes.txt --out latest.json
          cat latest.json

      - name: Release brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=$(python -c "from packaging.version import Version; print('--prerelease' if Version('$VERSION').is_prerelease else '')")
          gh release create "$GITHUB_REF_NAME" --draft $PRERELEASE \
            --title "Kaloé $VERSION" --notes-file notes.txt \
            "$INSTALLER" latest.json
