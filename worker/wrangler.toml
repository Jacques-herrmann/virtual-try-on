name = "vto-licence"
main = "src/index.ts"
# Domaine du site ; l'adresse *.workers.dev reste active (anciennes versions, essais).
routes = [{ pattern = "kaloe.fr", custom_domain = true }]
workers_dev = true
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

[vars]
PUBLIC_BASE_URL = "https://kaloe.fr"
GITHUB_REPO = "Jacques-herrmann/virtual-try-on"
PAYMENT_LINK_URL = "https://buy.stripe.com/test_3cIcN55nA7Y43ACgzTeAg00"
# Prix Stripe de Kaloé (séparés par des virgules) : les paiements d'autres produits
# du compte Stripe sont ignorés. Le premier est le tarif actuel (réabonnement par /renouveler) ;
# garder les anciens prix à la suite tant que des abonnements les portent.
STRIPE_PRICE_IDS = "price_1UQ1h9DoMopLYumvQq7RoLk2"
# Identifiant de la clé de signature (TOKEN_PRIVATE_KEY) ; l'app embarque les clés publiques par identifiant.
TOKEN_KEY_ID = "k1"
# Expéditeur des e-mails (Resend, domaine kaloe.fr vérifié).
EMAIL_FROM = "Kaloé <licence@kaloe.fr>"

[[d1_databases]]
binding = "DB"
database_name = "vto-licence"
database_id = "8148fa2e-08b9-47cf-939e-19bc9c7f2c22"
migrations_dir = "migrations"

# Secrets (wrangler secret put) : STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# TOKEN_PRIVATE_KEY, GITHUB_TOKEN, RESEND_API_KEY.
