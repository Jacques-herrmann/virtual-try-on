[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vto"
version = "0.1.0"
description = "Photos portées et annonces Vinted générées par IA"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "pydantic>=2",
    "Pillow>=11.3",  # AVIF natif
    "platformdirs",
    "typer",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
legacy = ["selenium>=4.11"]

[project.scripts]
vto = "vto.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vto"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: appelle la vraie API Gemini (nécessite GEMINI_API_KEY)"]
addopts = "-m 'not live'"
