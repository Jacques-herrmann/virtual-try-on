[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vto"
version = "0.1.0"
description = "Photos portées et annonces Vinted générées par IA"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2",  # Interactions API
    "pydantic>=2",
    "Pillow>=11.3",  # AVIF natif
    "platformdirs",
    "typer",
    "fastapi",
    "uvicorn",
    "python-multipart",  # uploads multipart de FastAPI
    "pywebview",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
legacy = ["selenium>=4.11"]

[project.scripts]
vto = "vto.cli:app"
vto-app = "vto.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vto"]
# Le front compilé (api/static) est ignoré par git mais doit être embarqué.
artifacts = ["src/vto/api/static/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["vto", "fakes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: appelle la vraie API Gemini (nécessite GEMINI_API_KEY)"]
addopts = "-m 'not live'"
