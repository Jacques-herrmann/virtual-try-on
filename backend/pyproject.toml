[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vto"
dynamic = ["version"]
description = "Photos portées et annonces Vinted générées par IA"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2",  # Interactions API
    "pydantic>=2",
    "Pillow>=11.3",  # AVIF natif
    "platformdirs",
    "typer",
    "fastapi",
    "uvicorn",
    "python-multipart",  # uploads multipart de FastAPI
    "pywebview",
    "playwright>=1.63",  # pilote Chrome/Edge installé, aucun navigateur téléchargé
    "httpx>=0.28",  # téléchargement de vinted.json et des mises à jour
    "packaging",  # comparaison des versions (mises à jour)
    "cryptography>=46",  # vérification des jetons de licence (Ed25519)
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx2"]  # httpx2 : client de TestClient
build = ["pyinstaller>=6.22"]

[project.scripts]
vto = "vto.cli:app"
vto-app = "vto.desktop:main"
vto-vinted-catalog = "vto.tools.vinted_catalog:main"
vto-tutorial = "vto.tools.tutorial:main"

[tool.hatch.version]
path = "src/vto/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vto"]
# Le front compilé (api/static) est ignoré par git mais doit être embarqué.
artifacts = [
    "src/vto/api/static/**",
    "src/vto/vinted/data/*.json",
    "src/vto/core/default_scenes/**",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["vto", "fakes", "conftest", "samples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: appelle la vraie API Gemini (nécessite GEMINI_API_KEY)",
    "browser: pilote un vrai navigateur",
    "live_vinted: crée un brouillon sur vinted.fr",
]
addopts = "-m 'not live and not live_vinted and not browser'"
